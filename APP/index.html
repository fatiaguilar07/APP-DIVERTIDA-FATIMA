<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Colores Divertida</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      transition:0.5s;
    }

    .card{
      width:350px;
      background:white;
      padding:30px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
    }

    h1{
      color:#ff4081;
      margin-bottom:15px;
    }

    p{
      color:#555;
      margin-bottom:20px;
    }

    .circulo{
      width:120px;
      height:120px;
      border-radius:50%;
      background:#ff4081;
      margin:20px auto;
      transition:0.5s;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    button{
      padding:12px 25px;
      border:none;
      border-radius:50px;
      background:#6c63ff;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
      background:#574bdb;
    }

    .texto{
      margin-top:20px;
      font-size:20px;
      font-weight:bold;
      color:#333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎨 App de Colores</h1>

    <p>Haz clic para cambiar el color y descubrir mensajes divertidos.</p>

    <div class="circulo" id="circulo"></div>

    <button onclick="cambiarColor()">
      Cambiar Color
    </button>

    <div class="texto" id="texto">
      ¡Presiona el botón!
    </div>
  </div>

  <script>
    const colores = [
      "#ff4081",
      "#00c853",
      "#2979ff",
      "#ff9100",
      "#aa00ff",
      "#ff1744",
      "#00b8d4"
    ];

    const mensajes = [
      "✨ Color mágico",
      "🔥 Vibra positiva",
      "🚀 Energía activada",
      "🌈 Día feliz",
      "😎 Modo divertido",
      "🎉 Fiesta de colores",
      "💡 Creatividad al máximo"
    ];

    function cambiarColor(){

      const colorRandom =
        colores[Math.floor(Math.random() * colores.length)];

      const mensajeRandom =
        mensajes[Math.floor(Math.random() * mensajes.length)];

      document.getElementById("circulo").style.background = colorRandom;

      document.body.style.background = colorRandom;

      document.getElementById("texto").innerHTML = mensajeRandom;
    }
  </script>

</body>
</html>
